[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web3-gig-finder"
version = "1.0.0"
description = "Find Web3/Blockchain freelance jobs, audit bounties, and grants"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.25",
]

[project.scripts]
web3gig = "web3_gig_finder.cli:main"

[tool.setuptools.packages.find]
include = ["web3_gig_finder*"]
